<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆座位管理系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>📚 图书馆座位管理系统</h1>
            <p class="subtitle">高校智慧图书馆 · 座位预约平台</p>
            <form id="loginForm">
                <!-- 角色选择 -->
                <div class="form-group">
                    <label>登录身份</label>
                    <div class="role-switch">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" checked>
                            <span>🎓 学生</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin">
                            <span>🛡️ 管理员</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentId">账号</label>
                    <input type="text" id="studentId" class="form-control" placeholder="学生填学号 / 管理员填 admin" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn-login">登 录</button>
                <p class="login-tip">管理员演示账号：<b>admin</b> / <b>admin123</b></p>
            </form>
            <div class="footer-info">
                <p>首次使用请联系图书馆管理员激活账号</p>
                <p>© 2026 图书馆座位管理系统 v1.0</p>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
