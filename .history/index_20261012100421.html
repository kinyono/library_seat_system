<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆座位管理系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <h1>📚 图书馆座位管理系统</h1>
                <p class="subtitle">南京大学图书馆 · 智能选座</p>
            </div>

            <!-- 角色切换 -->
            <div class="role-switch">
                <button class="role-btn active" data-role="student" onclick="switchRole('student')">🎓 学生</button>
                <button class="role-btn" data-role="admin" onclick="switchRole('admin')">🔧 管理员</button>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">学号 / 工号</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入学号" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <div id="loginError" class="login-error" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-login">登 录</button>
            </form>

            <!-- 演示账号快捷入口 -->
            <div class="demo-accounts">
                <p class="demo-title">快速体验</p>
                <div class="demo-buttons">
                    <button class="demo-btn student-demo" onclick="fillDemo('student')">🎓 学生演示</button>
                    <button class="demo-btn admin-demo" onclick="fillDemo('admin')">🔧 管理员演示</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
