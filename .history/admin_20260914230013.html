<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理后台 - 图书馆座位系统</title>
    
    <!-- 强制重置背景色，防止被登录页的紫色背景影响 -->
    <style>
        body {
            background-color: #f5f7fa !important;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #app {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            text-align: center;
        }
        .header-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #eee;
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- 必须的 JS 挂载点 -->
    <div id="app">
        <!-- 头部图片展示区 -->
        <!-- 这里使用的是在线占位图服务，尺寸300x200，背景色667eea，文字色白色 -->
        <img src="https://placehold.co/300x200/667eea/ffffff?text=Library+System" alt="图书馆系统头图" class="header-img">
        
        <h1>管理后台</h1>
        <p>✅ 页面基础结构、图片和样式加载成功！</p>
        <p>如果下方没有弹出 JS 渲染的绿色文字，请检查 admin.js 文件。</p>
    </div>

    <!-- 引入 JS 文件 -->
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
