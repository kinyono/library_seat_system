<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 图书馆座位系统</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/statistics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- 顶部导航 -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1>📊 数据统计</h1>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="profile-link">← 返回主页</a>
                <a href="../index.html" class="logout-link">退出</a>
            </div>
        </header>

        <!-- 概览卡片 -->
        <div class="stats-row" id="overviewCards">
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">累计学习时长（小时）</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalBookings">0</div>
                <div class="stat-label">累计预约次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgDuration">0</div>
                <div class="stat-label">平均单次时长（分钟）</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPenalty">0</div>
                <div class="stat-label">累计扣分</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <!-- 第一行：时长趋势 + 实时余量 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3>学习时长趋势</h3>
                    <div class="chart-toggle">
                        <button class="toggle-btn active" data-period="7">近7天</button>
                        <button class="toggle-btn" data-period="30">近30天</button>
                    </div>
                </div>
                <canvas id="trendChart" height="220"></canvas>
            </div>
            <div class="chart-card">
                <h3>座位实时余量</h3>
                <canvas id="seatAvailabilityChart" height="220"></canvas>
            </div>

            <!-- 第二行：区域偏好 + 楼层偏好 -->
            <div class="chart-card">
                <h3>区域偏好</h3>
                <canvas id="areaChart" height="180"></canvas>
            </div>
            <div class="chart-card">
                <h3>楼层偏好</h3>
                <canvas id="floorChart" height="180"></canvas>
            </div>

            <!-- 第三行：电源需求 + 学习峰值 -->
            <div class="chart-card">
                <h3>电源需求</h3>
                <canvas id="powerChart" height="160"></canvas>
            </div>
            <div class="chart-card">
                <h3>每日学习峰值（按起始时段）</h3>
                <canvas id="peakChart" height="160"></canvas>
            </div>
        </div>
    </div>

    <script src="../js/statistics.js"></script>
</body>
</html>
