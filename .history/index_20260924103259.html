<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆座位管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-bg"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-logo">📚</div>
                <h1>图书馆座位管理系统</h1>
                <div class="brand-sub">预约 · 签到 · 高效学习</div>
            </div>

            <!-- 角色切换 -->
            <div class="role-switch" id="roleSwitch">
                <label class="role-option active" data-role="student">
                    <input type="radio" name="role" value="student" checked>
                    <span>🎓 学生</span>
                </label>
                <label class="role-option" data-role="admin">
                    <input type="radio" name="role" value="admin">
                    <span>🛡️ 管理员</span>
                </label>
            </div>

            <!-- 错误提示 -->
            <div class="login-error" id="loginError" style="display:none;"></div>

            <!-- 登录表单 -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <div class="input-wrap">
                        <input type="text" id="username" class="form-control" placeholder="学号 / 管理员账号" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrap">
                        <input type="password" id="password" class="form-control" placeholder="密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-login" id="loginBtn">
                    登 录
                </button>
            </form>

            <!-- 演示提示 -->
            <div class="demo-tip">
                管理员演示账号：<code>admin</code> / <code>admin123</code>
                <button class="demo-fill" onclick="fillDemo()">一键填入</button>
            </div>

            <div class="login-footer">
                <div>学生使用任意学号+任意密码自动注册</div>
                <div class="copyright">&copy; 2026 图书馆座位管理系统</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
